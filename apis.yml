aid: microbenefits
name: MicroBenefits
description: MicroBenefits is a workforce-engagement and HR technology company, backed by 500
  Global, that created CompanyIQ — a scalable mobile platform for improving engagement, learning,
  and communication for factory and manufacturing workers, particularly across Asia. CompanyIQ
  bundles Worker Voice (employee feedback and dialogue), Digital Learning (safety, rights, and
  professional-development training), an Employee Portal (wage, hours, and benefits transparency),
  and Business Intelligence workforce analytics, alongside professional and learning services.
  The company operates a marketing and support presence but publishes no public developer API,
  documentation, or specification surface at this time.
